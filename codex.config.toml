model_provider = "amazon-bedrock"
model = "openai.gpt-5.6-luna"
approvals_reviewer = "auto_review"

[model_providers.amazon-bedrock.aws]
region = "us-east-1"

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/zeek/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/zeek/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "0"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.825.41651"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/zeek/.codex/plugins/cache/openai-bundled/browser/26.825.41651/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

# ---
[agents]
max_threads = 12
max_depth = 2 

# --- Gemma

[agents.gemma-low]
description = "Basic reasoning low"
model_provider = "ollama"
model = "gemma4:26b"
model_reasoning_effort = "low"

[agents.gemma-medium]
description = "Basic reasoning medium"
model_provider = "ollama"
model = "gemma4:26b"
model_reasoning_effort = "medium"

[agents.gemma-high]
description = "Basic reasoning high"
model_provider = "ollama"
model = "gemma4:26b"
model_reasoning_effort = "high"

